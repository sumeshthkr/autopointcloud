[package]
name = "autopointcloud"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A web application for point cloud processing built in Rust"
repository = "https://github.com/sumeshthkr/autopointcloud.git"
license = "MIT"

[dependencies]
# Web framework
actix-web = { version = "4", features = ["rustls"] }
actix-files = "0.6"
actix-cors = "0.7"
actix-multipart = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Point cloud processing
nalgebra = "0.32"

# File handling
tokio = { version = "1.0", features = ["full"] }
bytes = "1.0"
futures = "0.3"
byteorder = "1.5"
bincode = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Additional utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
env_logger = "0.10"
log = "0.4"

[dev-dependencies]
tempfile = "3.0"
