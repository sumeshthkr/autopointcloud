# Fly.io Configuration for AutoPointCloud
# This is the recommended platform for deploying this Rust application
# To deploy: flyctl launch (first time) or flyctl deploy (subsequent deployments)

app = "autopointcloud"
primary_region = "iad"

[build]
  # Fly.io will automatically detect and build the Rust application

[env]
  # Environment variables for the application
  RUST_LOG = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/api/health"

# VM Resources
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
