<!DOCTYPE html>
<html>
<head>
    <title>Three.js Test</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="container" style="width: 100%; height: 100vh; background: #f0f0f0;"></div>
    <script>
        console.log('Test page loaded, THREE:', typeof THREE);
        
        const container = document.getElementById('container');
        
        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        console.log('Renderer created and appended');
        
        // Create a simple cube
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        
        // Create some points
        const pointGeometry = new THREE.BufferGeometry();
        const pointPositions = new Float32Array([
            0, 0, 0,
            1, 0, 0,
            0, 1, 0,
            0, 0, 1,
        ]);
        pointGeometry.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
        
        const pointMaterial = new THREE.PointsMaterial({ size: 0.1, color: 0x00ff00 });
        const points = new THREE.Points(pointGeometry, pointMaterial);
        scene.add(points);
        
        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        
        animate();
        console.log('Animation started');
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
